<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIDEBA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            navy: { 800: '#1e293b', 900: '#0f172a', 950: '#080d1a' },
            court: { 500: '#f97316', 600: '#ea580c', 700: '#c2410c' }
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #0f172a; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    @media print {
      body { background-color: #ffffff !important; color: #000000 !important; }
      .no-print { display: none !important; }
      .print-container { box-shadow: none !important; border: none !important; padding: 0 !important; margin: 0 !important; width: 100% !important; max-width: 100% !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0 no-print"></div>

  <div id="forced-match-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4 no-print">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-slate-200 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-extrabold text-slate-900 flex items-center gap-2">
          <i data-lucide="handshake" class="w-5 h-5 text-court-600"></i>
          <span>Forzar Partido</span>
        </h3>
        <button onclick="closeForcedMatchModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Categoría</label>
          <select id="forced-cat-select" onchange="updateForcedTeamsDropdowns()" class="w-full rounded-xl border border-slate-300 p-2.5 text-xs font-bold bg-white"></select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Equipo 1</label>
            <select id="forced-team1-select" class="w-full rounded-xl border border-slate-300 p-2.5 text-xs font-semibold bg-white"></select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Equipo 2</label>
            <select id="forced-team2-select" class="w-full rounded-xl border border-slate-300 p-2.5 text-xs font-semibold bg-white"></select>
          </div>
        </div>
        <button onclick="addForcedMatch()" class="w-full py-2.5 rounded-xl bg-court-600 hover:bg-court-700 text-white font-bold text-xs transition">Agregar</button>
      </div>

      <div class="border-t border-slate-100 pt-3">
        <div id="forced-matches-list" class="space-y-1.5 max-h-32 overflow-y-auto"></div>
      </div>

      <div class="flex justify-end pt-2">
        <button onclick="closeForcedMatchModal()" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="manual-match-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4 no-print">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-200 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-extrabold text-slate-900 flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-5 h-5 text-court-600"></i>
          <span>Partido Manual</span>
        </h3>
        <button onclick="closeAddManualMatchModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Día</label>
          <select id="manual-match-day" class="w-full rounded-xl border border-slate-300 p-2 font-bold bg-white"></select>
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Hora</label>
          <select id="manual-match-time" class="w-full rounded-xl border border-slate-300 p-2 font-bold bg-white"></select>
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Cancha</label>
          <select id="manual-match-court" class="w-full rounded-xl border border-slate-300 p-2 font-bold bg-white"></select>
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Categoría</label>
          <select id="manual-match-cat" onchange="updateManualTeamsDropdown()" class="w-full rounded-xl border border-slate-300 p-2 font-bold bg-white"></select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Local</label>
            <select id="manual-match-home" class="w-full rounded-xl border border-slate-300 p-2 font-semibold bg-white"></select>
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Visitante</label>
            <select id="manual-match-away" class="w-full rounded-xl border border-slate-300 p-2 font-semibold bg-white"></select>
          </div>
        </div>
        <button onclick="confirmAddManualMatch()" class="w-full py-2.5 rounded-xl bg-court-600 hover:bg-court-700 text-white font-bold transition">Añadir</button>
      </div>
    </div>
  </div>

  <header class="bg-navy-900 text-white shadow-lg sticky top-0 z-30 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-court-500 to-court-700 flex items-center justify-center text-white shadow-md shrink-0">
            <i data-lucide="trophy" class="w-6 h-6"></i>
          </div>
          <div>
            <input
              id="league-title-input"
              type="text"
              value="LIDEBA"
              aria-label="Liga"
              onchange="state.leagueTitle = this.value; saveLocalStorage();"
              class="bg-transparent hover:bg-white/10 focus:bg-white/15 text-white font-extrabold text-xl tracking-tight rounded-lg px-2 py-0.5 -ml-2 border border-transparent focus:border-court-500 focus:outline-none transition w-full"
            />
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <button onclick="exportSeasonBackup()" class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-medium text-slate-200 flex items-center gap-1.5 transition">
            <i data-lucide="download" class="w-3.5 h-3.5"></i>
            <span>JSON</span>
          </button>
          <label class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-medium text-slate-200 flex items-center gap-1.5 transition cursor-pointer">
            <i data-lucide="upload" class="w-3.5 h-3.5"></i>
            <span>JSON</span>
            <input type="file" accept=".json" class="hidden" onchange="importSeasonBackup(event)" />
          </label>
        </div>
      </div>

      <nav class="flex gap-2 mt-4 overflow-x-auto pb-1">
        <button onclick="switchTab('weekend')" id="tab-btn-weekend" class="tab-btn flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold transition whitespace-nowrap bg-court-600 text-white shadow">
          <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
          <span>1. Sábado</span>
          <span id="badge-weekend-active" class="ml-1 px-2 py-0.5 text-xs rounded-full bg-white/10">0 eq.</span>
        </button>

        <button onclick="switchTab('schedule')" id="tab-btn-schedule" class="tab-btn flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold transition whitespace-nowrap text-slate-300 hover:bg-white/10">
          <i data-lucide="calendar-days" class="w-4 h-4"></i>
          <span>2. Rol</span>
          <span id="badge-schedule-count" class="ml-1 px-2 py-0.5 text-xs rounded-full bg-white/10">0</span>
        </button>

        <button onclick="switchTab('standings')" id="tab-btn-standings" class="tab-btn flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold transition whitespace-nowrap text-slate-300 hover:bg-white/10">
          <i data-lucide="history" class="w-4 h-4"></i>
          <span>3. Historial</span>
          <span id="badge-saved-jornadas" class="ml-1 px-2 py-0.5 text-xs rounded-full bg-white/10">0 jorn.</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <section id="tab-weekend" class="space-y-6">
      <div class="bg-gradient-to-r from-navy-900 to-navy-800 rounded-2xl p-5 sm:p-6 text-white shadow-md flex flex-col lg:flex-row lg:items-center justify-between gap-4">
        <div class="space-y-1.5 flex-1">
          <input
            id="weekend-label-input"
            type="text"
            value="Jornada 1 - Sábado"
            onchange="state.weekendLabel = this.value; saveLocalStorage();"
            class="bg-white/10 hover:bg-white/15 focus:bg-white/20 text-white font-bold text-lg sm:text-xl rounded-xl px-3 py-1 border border-white/15 focus:border-court-500 focus:outline-none w-full sm:w-96"
          />
        </div>

        <button onclick="generateSchedule()" class="px-6 py-3.5 rounded-xl bg-court-600 hover:bg-court-500 text-white font-extrabold text-sm sm:text-base shadow-lg shadow-court-600/30 flex items-center justify-center gap-2.5 transition transform active:scale-95">
          <i data-lucide="wand-2" class="w-5 h-5"></i>
          <span>Generar Rol</span>
        </button>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-emerald-200 px-5 py-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>
          <span class="text-xs font-extrabold text-slate-900">Google Sheet</span>
          <span id="sheet-live-status" class="text-xs text-slate-500">...</span>
        </div>
        <span id="sheet-history-status" class="text-[11px] font-semibold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200 shrink-0">
          0
        </span>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
          <h3 class="font-bold text-slate-900 flex items-center gap-2 text-base">
            <i data-lucide="map-pin" class="w-4 h-4 text-court-600"></i>
            <span>Canchas</span>
          </h3>
          <div>
            <div class="flex items-center gap-2">
              <input type="number" id="courts-count-input" min="1" max="15" value="3" onchange="updateCourtsCount(this.value)" class="w-20 rounded-xl border border-slate-300 px-3 py-2 text-sm font-bold text-center focus:ring-2 focus:ring-court-500 focus:outline-none" />
            </div>
            <div id="court-names-container" class="mt-2.5 flex flex-wrap gap-1.5"></div>
          </div>
          <div class="pt-2 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2">
            <div id="days-checkboxes" class="flex flex-wrap gap-2"></div>
            <div class="text-xs font-bold text-slate-700 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200">
              08:00 - 16:00
            </div>
          </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-3">
          <h3 class="font-bold text-slate-900 flex items-center gap-2 text-base">
            <i data-lucide="cpu" class="w-4 h-4 text-court-600"></i>
            <span>Reglas</span>
          </h3>
          <label class="flex items-center gap-2.5 p-2.5 rounded-xl bg-slate-50 border border-slate-200 cursor-pointer hover:bg-slate-100 transition">
            <input type="checkbox" id="rule-avoid-rematch" checked onchange="updateRuleToggle('avoidRematch', this.checked)" class="w-4 h-4 text-court-600 rounded border-slate-300" />
            <span class="text-xs font-bold text-slate-800">Sin repetir por categoría</span>
          </label>
          <label class="flex items-center gap-2.5 p-2.5 rounded-xl bg-slate-50 border border-slate-200 cursor-pointer hover:bg-slate-100 transition">
            <input type="checkbox" id="rule-avoid-same-club-match" checked onchange="updateRuleToggle('avoidSameClubMatchup', this.checked)" class="w-4 h-4 text-court-600 rounded border-slate-300" />
            <span class="text-xs font-bold text-slate-800">Evitar mismo club</span>
          </label>
          <button onclick="openForcedMatchModal()" class="w-full py-2.5 px-3 rounded-xl border border-dashed border-navy-800/40 hover:border-court-600 hover:bg-court-500/5 text-navy-900 text-xs font-bold flex items-center justify-center gap-2 transition">
            <i data-lucide="handshake" class="w-4 h-4 text-court-600"></i>
            <span>Forzar (<span id="forced-matches-count">0</span>)</span>
          </button>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6 space-y-5">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
          <div class="flex flex-wrap items-center gap-2">
            <button onclick="setRamaFilter('ALL')" id="filter-btn-ALL" class="px-3 py-1.5 rounded-lg text-xs font-bold transition bg-navy-900 text-white">Todos</button>
            <button onclick="setRamaFilter('VARONIL')" id="filter-btn-VARONIL" class="px-3 py-1.5 rounded-lg text-xs font-bold transition bg-white text-slate-700 border border-slate-300">Varonil</button>
            <button onclick="setRamaFilter('FEMENIL')" id="filter-btn-FEMENIL" class="px-3 py-1.5 rounded-lg text-xs font-bold transition bg-white text-slate-700 border border-slate-300">Femenil</button>
          </div>
          <div class="relative w-full sm:w-60">
            <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input type="text" id="weekend-search-club" oninput="renderWeekendClubs()" placeholder="Buscar..." class="w-full pl-8 pr-3 py-2 rounded-xl border border-slate-300 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-court-500 bg-white" />
          </div>
        </div>

        <div id="weekend-clubs-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>
      </div>
    </section>

    <section id="tab-schedule" class="hidden space-y-6">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 space-y-4 no-print">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex flex-wrap items-center gap-2">
            <button onclick="copyScheduleForGoogleSheets()" class="px-3.5 py-2.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 font-bold text-xs flex items-center gap-1.5 transition">
              <i data-lucide="table" class="w-4 h-4 text-emerald-600"></i>
              <span>Copiar Sheets</span>
            </button>
            <button id="btn-save-jornada" onclick="saveCurrentScheduleToHistory()" class="px-4 py-2.5 rounded-xl bg-navy-900 hover:bg-navy-800 text-white font-bold text-xs sm:text-sm flex items-center gap-2 shadow-sm transition">
              <i data-lucide="save" class="w-4 h-4 text-court-500"></i>
              <span>Guardar</span>
            </button>
            <button onclick="openAddManualMatchModal()" class="px-3.5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold text-xs sm:text-sm flex items-center gap-1.5 transition">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>Manual</span>
            </button>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-2 pt-3 border-t border-slate-100">
          <select id="sched-filter-rama" onchange="renderScheduleTab()" class="rounded-xl border border-slate-300 px-3 py-1.5 text-xs font-semibold bg-white">
            <option value="ALL">Ramas</option>
            <option value="VARONIL">Varonil</option>
            <option value="FEMENIL">Femenil</option>
          </select>
          <select id="sched-filter-cat" onchange="renderScheduleTab()" class="rounded-xl border border-slate-300 px-3 py-1.5 text-xs font-semibold bg-white">
            <option value="ALL">Categorías</option>
          </select>
          <select id="sched-filter-club" onchange="renderScheduleTab()" class="rounded-xl border border-slate-300 px-3 py-1.5 text-xs font-semibold bg-white">
            <option value="ALL">Clubes</option>
          </select>
        </div>
      </div>

      <div id="schedule-alerts-box" class="space-y-3 no-print"></div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-8 print-container">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b-2 border-navy-900 pb-4 mb-6 gap-2">
          <div>
            <h2 id="print-league-name" class="text-2xl font-black text-navy-900 tracking-tight">LIDEBA</h2>
            <p id="print-jornada-name" class="text-sm font-bold text-court-600"></p>
          </div>
          <div class="text-left sm:text-right text-xs text-slate-500">
            <p id="print-timestamp"></p>
            <p id="print-match-counter" class="font-bold text-slate-800 mt-0.5"></p>

        <div id="schedule-tables-container" class="space-y-8"></div>

    <section id="tab-standings" class="hidden space-y-6">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6 space-y-4">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-4">
          <h3 class="text-lg font-extrabold text-slate-900 flex items-center gap-2">
            <i data-lucide="folder-kanban" class="w-5 h-5 text-court-600"></i>
            <span>ROLES_GUARDADOS</span>
          </h3>
          <span class="text-xs font-bold px-3 py-1.5 rounded-xl bg-slate-100 text-slate-800">
            <span id="total-saved-jornadas-text">0</span>
          </span>
        </div>

        <div id="saved-jornadas-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6 space-y-4">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-3">
          <h3 class="text-base font-extrabold text-slate-900 flex items-center gap-2">
            <i data-lucide="list-checks" class="w-4 h-4 text-court-600"></i>
            <span id="active-jornada-title-label"></span>
          </h3>
          <button onclick="copySelectedJornadaForSheets()" id="btn-copy-selected-jornada" class="hidden px-3.5 py-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 font-bold text-xs flex items-center gap-1.5 transition">
            <i data-lucide="table" class="w-4 h-4 text-emerald-600"></i>
            <span>Copiar</span>
          </button>
        </div>
        <div id="jornada-detail-container" class="space-y-2 max-h-96 overflow-y-auto pr-1"></div>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'lideba_sheets_only_v1';
    const LIVE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRjdrdk1PbdVZszD9aKiZFqb4eflydLxFnGeNN5xhIgivmm9oRfye7qtj5RYKY7hrfOtwoXnXRjTbGb/pub?output=csv";
    const SAVED_ROLES_CSV_URL = "";
    const SHEETS_SAVE_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxKcXGmW37qW_TS7SRuiRhaTYVxfMy5r_MaNi8f5FXX90HmnEB42grWOAOeBUNB2Z9W/exec";
    const SHEETS_TARGET_TAB = "ROLES_GUARDADOS";
    const RESTRICTED_TIMESLOTS = ["08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00"];
    const AUTO_POLL_MS = 10000;

    let lastSheetSignature = "";
    let lastSavedRolesSignature = "";
    let isPollingSheet = false;
    let sheetPlayedMatchupsCount = {};
    let sheetSavedJornadas = [];
    let sheetSyncedSuccessfully = false;

    let state = {
      leagueTitle: "LIDEBA",
      courtsCount: 3,
      courtNames: ["Cancha 1", "Cancha 2", "Cancha 3"],
      days: ["Sábado"],
      rules: { avoidRematch: true, avoidSameClubMatchup: true },
      weekendLabel: "Jornada 1 - Sábado",
      activeTeams: {},
      forcedMatches: [],
      currentSchedule: [],
      activeJornadaId: null,
      selectedRamaFilter: 'ALL'
    };

    function normalizeKeyPart(val) {
      return (val || "").toString().trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function buildMatchupKey(teamA, teamB, rama, category) {
      let a = normalizeKeyPart(teamA);
      let b = normalizeKeyPart(teamB);
      let r = normalizeKeyPart(rama || "VARONIL").includes("fem") ? "femenil" : "varonil";
      let c = normalizeKeyPart(category);
      return [a, b].sort().join('___') + `|${r}|${c}`;
    }

    function normalizeTimeToAllowedWindow(rawTime) {
      let s = (rawTime || "08:00").toString().trim();
      if (s.includes("T")) {
        let dt = new Date(s);
        if (!isNaN(dt.getTime())) {
          s = `${String(dt.getHours()).padStart(2, '0')}:00`;
        }
      }
      if (s.length === 4 && s.includes(":")) s = "0" + s;
      let hourNum = parseInt(s.split(":")[0], 10);
      if (isNaN(hourNum)) return "08:00";
      if (hourNum < 8) return "08:00";
      if (hourNum > 16) return "16:00";
      let formatted = `${String(hourNum).padStart(2, '0')}:00`;
      return RESTRICTED_TIMESLOTS.includes(formatted) ? formatted : "08:00";
    }

    function fetchSheetViaJsonp(rawUrl, sheetTabName = "") {
      return new Promise((resolve, reject) => {
        let pubMatch = rawUrl.match(/\/spreadsheets\/d\/e\/([a-zA-Z0-9-_]+)/);
        let stdMatch = rawUrl.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
        let baseUrl = null;
        if (pubMatch && pubMatch[1]) {
          baseUrl = `https://docs.google.com/spreadsheets/d/e/${pubMatch[1]}/gviz/tq?tqx=out:json`;
        } else if (stdMatch && stdMatch[1]) {
          baseUrl = `https://docs.google.com/spreadsheets/d/${stdMatch[1]}/gviz/tq?tqx=out:json`;
        }
        if (!baseUrl) {
          reject(new Error("URL"));
          return;
        }
        if (sheetTabName) {
          baseUrl += `&sheet=${encodeURIComponent(sheetTabName)}`;
        }

        let cbName = "lidebaGvizCb_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
        let script = document.createElement('script');
        let timer = setTimeout(() => {
          cleanup();
          reject(new Error("Timeout"));
        }, 8000);

        function cleanup() {
          clearTimeout(timer);
          if (script.parentNode) script.parentNode.removeChild(script);
          delete window[cbName];
        }

        window[cbName] = function(payload) {
          cleanup();
          try {
            let cols = (payload.table?.cols || []).map(c => c.label || c.id || "");
            let rows = (payload.table?.rows || []).map(r =>
              (r.c || []).map(cell => (cell && cell.v !== null && cell.v !== undefined) ? String(cell.v) : "")
            );
            let csvLines = [cols.map(v => `"${v.replace(/"/g, '""')}"`).join(",")];
            rows.forEach(r => {
              csvLines.push(r.map(v => `"${v.replace(/"/g, '""')}"`).join(","));
            });
            resolve(csvLines.join("\n"));
          } catch (e) {
            reject(e);
          }
        };

        script.src = `${baseUrl}&tqx=responseHandler:${cbName}`;
        script.onerror = () => {
          cleanup();
          reject(new Error("Network"));
        };
        document.body.appendChild(script);
      });
    }

    function fetchSavedRolesViaAppsScript() {
      return new Promise((resolve) => {
        if (!SHEETS_SAVE_WEBHOOK_URL || SHEETS_SAVE_WEBHOOK_URL.includes("PEGA_AQUI")) {
          resolve(null);
          return;
        }
        let cbName = "lidebaAppsScriptCb_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
        let script = document.createElement('script');
        let timer = setTimeout(() => {
          cleanup();
          resolve(null);
        }, 6000);

        function cleanup() {
          clearTimeout(timer);
          if (script.parentNode) script.parentNode.removeChild(script);
          delete window[cbName];
        }

        window[cbName] = function(data) {
          cleanup();
          if (Array.isArray(data)) resolve(data);
          else if (data && Array.isArray(data.rows)) resolve(data.rows);
          else if (data && Array.isArray(data.matches)) resolve(data.matches);
          else resolve(null);
        };

        let sep = SHEETS_SAVE_WEBHOOK_URL.includes('?') ? '&' : '?';
        script.src = `${SHEETS_SAVE_WEBHOOK_URL}${sep}action=read&sheet=${encodeURIComponent(SHEETS_TARGET_TAB)}&callback=${cbName}&_t=${Date.now()}`;
        script.onerror = () => {
          cleanup();
          resolve(null);
        };
        document.body.appendChild(script);
      });
    }

    function parseCSVLine(line) {
      let result = [];
      let current = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        let ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          result.push(current.trim());
          current = "";
        } else {
          current += ch;
        }
      }
      result.push(current.trim());
      return result;
    }

    function parseTeamsCSV(csvText) {
      let lines = csvText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length < 2) return {};

      let headers = parseCSVLine(lines[0]).map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ''));
      let idxRama = headers.findIndex(h => h.includes('rama'));
      let idxCat = headers.findIndex(h => h.includes('cat'));
      let idxClub = headers.findIndex(h => h.includes('club'));
      let idxEq = headers.findIndex(h => h.includes('equipo') || h.includes('nombre') || h.includes('team'));
      let idxAct = headers.findIndex(h => h.includes('activo') || h.includes('check') || h.includes('juega') || h.includes('active'));
      let idxRest = headers.findIndex(h => h.includes('restric'));
      let idxHora = headers.findIndex(h => h.includes('hora') || h.includes('time'));
      let idxNota = headers.findIndex(h => h.includes('nota') || h.includes('hint') || h.includes('obs'));

      let parsedMap = {};

      for (let i = 1; i < lines.length; i++) {
        let cols = parseCSVLine(lines[i]);
        let rawRama = (cols[idxRama >= 0 ? idxRama : 0] || "VARONIL").toUpperCase();
        let rama = rawRama.includes("FEM") ? "FEMENIL" : "VARONIL";
        let cat = (cols[idxCat >= 0 ? idxCat : 1] || "").trim();
        let club = (cols[idxClub >= 0 ? idxClub : 2] || "").trim();
        let name = (cols[idxEq >= 0 ? idxEq : 3] || club).trim();

        if (!cat || !club || !name) continue;

        let rawAct = (cols[idxAct >= 0 ? idxAct : 4] || "").toString().trim().toUpperCase();
        let active = ["SI", "SÍ", "YES", "TRUE", "1", "X", "ACTIVO"].includes(rawAct);

        let rawRest = (cols[idxRest >= 0 ? idxRest : 5] || "NONE").toString().trim().toUpperCase();
        let restriction = "NONE";
        if (rawRest.includes("EARLY") || rawRest.includes("TEMP")) restriction = "EARLY";
        else if (rawRest.includes("LATE") || rawRest.includes("TARDE")) restriction = "LATE";
        else if (rawRest.includes("EXACT") || rawRest.includes("HORA")) restriction = "EXACT";

        let specificTime = normalizeTimeToAllowedWindow(cols[idxHora >= 0 ? idxHora : 6] || "08:00");
        let hint = (cols[idxNota >= 0 ? idxNota : 7] || "").trim();
        let isPrac = hint.toLowerCase().includes("practica") || name.toLowerCase().includes("practica");

        let key = `${rama}|${cat}|${club}|${name}`;
        parsedMap[key] = {
          rama,
          category: cat,
          club,
          name,
          active,
          isPractice: isPrac,
          hint,
          restriction,
          specificTime
        };
      }

      return parsedMap;
    }

    function parseSavedRolesCSV(csvText) {
      let lines = csvText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length < 1) return { counts: {}, jornadas: [], totalMatches: 0, validResponse: false };

      let headers = parseCSVLine(lines[0]).map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ''));
      let idxJornada = headers.findIndex(h => h.includes('jornada') || h.includes('fecha') || h.includes('titulo'));
      let idxCat = headers.findIndex(h => h.includes('cat'));
      let idxRama = headers.findIndex(h => h.includes('rama'));
      let idxHora = headers.findIndex(h => h.includes('hora') || h.includes('time'));
      let idxCancha = headers.findIndex(h => h.includes('cancha') || h.includes('court'));
      let idxLocal = headers.findIndex(h => h.includes('local') || h.includes('home'));
      let idxVisit = headers.findIndex(h => h.includes('visit') || h.includes('away'));

      let hasHeaderRow = (idxLocal >= 0 && idxVisit >= 0) || headers.some(h => h.includes('jornada') || h.includes('cancha'));
      let startRow = hasHeaderRow ? 1 : 0;

      let counts = {};
      let jornadasMap = {};
      let totalMatches = 0;

      for (let i = startRow; i < lines.length; i++) {
        let cols = parseCSVLine(lines[i]);
        let jornadaTitle = (cols[idxJornada >= 0 ? idxJornada : 0] || "Jornada").trim();
        let cat = (cols[idxCat >= 0 ? idxCat : 1] || "").trim();
        let rawRama = (cols[idxRama >= 0 ? idxRama : 2] || "VARONIL").toUpperCase();
        let rama = rawRama.includes("FEM") ? "FEMENIL" : "VARONIL";
        let time = normalizeTimeToAllowedWindow(cols[idxHora >= 0 ? idxHora : 3] || "08:00");
        let court = (cols[idxCancha >= 0 ? idxCancha : 4] || "Cancha 1").trim();
        let homeTeam = (cols[idxLocal >= 0 ? idxLocal : 5] || "").trim();
        let awayTeam = (cols[idxVisit >= 0 ? idxVisit : 6] || "").trim();

        if (!homeTeam || !awayTeam) continue;
        totalMatches++;

        let pairKey = buildMatchupKey(homeTeam, awayTeam, rama, cat);
        counts[pairKey] = (counts[pairKey] || 0) + 1;

        let jKey = normalizeKeyPart(jornadaTitle);
        if (!jornadasMap[jKey]) {
          jornadasMap[jKey] = {
            id: 'sheet_j_' + btoa(unescape(encodeURIComponent(jKey))).replace(/[^a-zA-Z0-9]/g, '').slice(0, 12) + '_' + i,
            title: jornadaTitle,
            date: "Sheet",
            matches: []
          };
        }

        jornadasMap[jKey].matches.push({
          id: 'sm_' + i,
          rama,
          category: cat,
          day: "Sábado",
          time,
          court,
          homeTeam,
          homeClub: homeTeam,
          awayTeam,
          awayClub: awayTeam
        });
      }

      return { counts, jornadas: Object.values(jornadasMap), totalMatches, validResponse: true };
    }

    function parseSavedRolesRowsArray(rows) {
      if (!Array.isArray(rows)) return { counts: {}, jornadas: [], totalMatches: 0, validResponse: false };
      if (rows.length === 0) return { counts: {}, jornadas: [], totalMatches: 0, validResponse: true };

      let csvLines = [];
      rows.forEach(r => {
        if (Array.isArray(r)) {
          csvLines.push(r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(","));
        } else if (r && typeof r === 'object') {
          let vals = [
            r.jornada ?? r.Jornada ?? '',
            r.categoria ?? r.categoría ?? r['Categoría'] ?? '',
            r.rama ?? r.Rama ?? '',
            r.hora ?? r.Hora ?? '',
            r.cancha ?? r.Cancha ?? '',
            r.local ?? r.Local ?? '',
            r.visitante ?? r.Visitante ?? ''
          ];
          csvLines.push(vals.map(v => `"${String(v).replace(/"/g, '""')}"`).join(","));
        }
      });

      if (csvLines.length === 0) return { counts: {}, jornadas: [], totalMatches: 0, validResponse: true };
      let hasHeader = csvLines[0].toLowerCase().includes('jornada') && csvLines[0].toLowerCase().includes('local');
      let finalCsv = hasHeader
        ? csvLines.join("\n")
        : `"Jornada","Categoría","Rama","Hora","Cancha","Local","Visitante"\n` + csvLines.join("\n");
      return parseSavedRolesCSV(finalCsv);
    }

    async function syncSavedRolesFromSheet(isBackground = true) {
      let statusBadge = document.getElementById('sheet-history-status');
      let parsed = null;

      try {
        if (SAVED_ROLES_CSV_URL && SAVED_ROLES_CSV_URL.trim() !== "") {
          let url = `${SAVED_ROLES_CSV_URL}${SAVED_ROLES_CSV_URL.includes('?') ? '&' : '?'}_t=${Date.now()}`;
          let res = await fetch(url, { cache: 'no-store' });
          if (res.ok) {
            let txt = await res.text();
            if (!txt.trim().startsWith("<!DOCTYPE") && !txt.trim().startsWith("<html")) {
              parsed = parseSavedRolesCSV(txt);
            }
          }
        }

        if (!parsed) {
          let csvText = await fetchSheetViaJsonp(LIVE_SHEET_CSV_URL, SHEETS_TARGET_TAB);
          if (csvText && csvText.trim().length > 0) {
            parsed = parseSavedRolesCSV(csvText);
          }
        }
      } catch (e) {
        parsed = null;
      }

      if (!parsed) {
        let appScriptRows = await fetchSavedRolesViaAppsScript();
        if (appScriptRows !== null) {
          parsed = parseSavedRolesRowsArray(appScriptRows);
        }
      }

      if (parsed && parsed.validResponse) {
        let sig = JSON.stringify({ c: parsed.counts, t: parsed.totalMatches });
        let changed = lastSavedRolesSignature !== "" && sig !== lastSavedRolesSignature;
        lastSavedRolesSignature = sig;
        sheetSyncedSuccessfully = true;
        sheetPlayedMatchupsCount = parsed.counts || {};
        sheetSavedJornadas = parsed.jornadas || [];

        if (state.activeJornadaId && !getSheetJornadas().some(j => j.id === state.activeJornadaId)) {
          state.activeJornadaId = getSheetJornadas()[0]?.id || null;
          saveLocalStorage();
        }

        updateBadges();
        if (!document.getElementById('tab-standings').classList.contains('hidden')) {
          renderHistoryTab();
        }
        if (!document.getElementById('tab-schedule').classList.contains('hidden')) {
          renderScheduleTab();
        }
        if (changed && isBackground) {
          showToast(`${parsed.totalMatches}`);
        }
        if (statusBadge) {
          statusBadge.innerText = `${parsed.totalMatches}`;
        }
      } else if (statusBadge) {
        statusBadge.innerText = `${Object.keys(sheetPlayedMatchupsCount).length}`;
      }
    }

    async function pollGoogleSheetLive(isBackground = true) {
      if (isPollingSheet) return;
      isPollingSheet = true;
      let statusEl = document.getElementById('sheet-live-status');

      try {
        let csvText = "";
        let cacheBustUrl = `${LIVE_SHEET_CSV_URL}${LIVE_SHEET_CSV_URL.includes('?') ? '&' : '?'}_t=${Date.now()}`;
        try {
          let res = await fetch(cacheBustUrl, { cache: 'no-store' });
          if (!res.ok) throw new Error("HTTP");
          csvText = await res.text();
          if (csvText.trim().startsWith("<!DOCTYPE") || csvText.trim().startsWith("<html")) {
            throw new Error("HTML");
          }
        } catch (fetchErr) {
          csvText = await fetchSheetViaJsonp(LIVE_SHEET_CSV_URL);
        }

        let sig = csvText.trim();
        let teamsFromSheet = parseTeamsCSV(csvText);
        let count = Object.keys(teamsFromSheet).length;

        if (count > 0 && sig !== lastSheetSignature) {
          let hadPreviousData = lastSheetSignature !== "";
          lastSheetSignature = sig;
          state.activeTeams = teamsFromSheet;
          saveLocalStorage();
          populateCategoryDropdowns();
          renderWeekendClubs();
          updateBadges();
          if (hadPreviousData && isBackground) {
            showToast(`${count}`);
          }
        }

        let activeChecked = Object.values(state.activeTeams).filter(t => t.active).length;
        let hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        if (statusEl) {
          statusEl.innerText = `${activeChecked}/${Object.keys(state.activeTeams).length} • ${hora}`;
        }
      } catch (err) {
        if (statusEl) {
          statusEl.innerText = "...";
        }
      } finally {
        await syncSavedRolesFromSheet(isBackground);
        isPollingSheet = false;
      }
    }

    function generateSchedule() {
      state.weekendLabel = document.getElementById('weekend-label-input').value || "Jornada 1 - Sábado";
      let activeList = Object.values(state.activeTeams).filter(t => t.active);

      if (activeList.length < 2) {
        showToast('2+', 'error');
        return;
      }

      let playedHistory = getPlayedMatchupsCount();
      let usedInCurrentCategory = new Set();

      let byCat = {};
      activeList.forEach(t => {
        let groupKey = `${t.rama}|${t.category}`;
        if (!byCat[groupKey]) byCat[groupKey] = [];
        byCat[groupKey].push({ id: t.key, ...t });
      });

      let rawPairs = [];

      Object.entries(byCat).forEach(([groupKey, teams]) => {
        let [rama, cat] = groupKey.split('|');
        let pool = [...teams].sort(() => Math.random() - 0.5);

        state.forcedMatches.forEach(fm => {
          if (fm.category === cat) {
            let t1 = pool.find(x => x.id === fm.team1Id);
            let t2 = pool.find(x => x.id === fm.team2Id);
            if (t1 && t2) {
              let pairKey = buildMatchupKey(t1.name, t2.name, rama, cat);
              rawPairs.push({ cat, rama, t1, t2, pairKey });
              usedInCurrentCategory.add(pairKey);
              pool = pool.filter(x => x.id !== t1.id && x.id !== t2.id);
            }
          }
        });

        while (pool.length >= 2) {
          let t1 = pool.shift();
          let bestIdx = 0;
          let bestScore = Infinity;

          for (let i = 0; i < pool.length; i++) {
            let candidate = pool[i];
            let pairKey = buildMatchupKey(t1.name, candidate.name, rama, cat);
            let dupInCatPenalty = usedInCurrentCategory.has(pairKey) ? 100000 : 0;
            let timesPlayed = state.rules.avoidRematch ? (playedHistory[pairKey] || 0) : 0;
            let sameClubPenalty = (state.rules.avoidSameClubMatchup && normalizeKeyPart(t1.club) === normalizeKeyPart(candidate.club)) ? 25 : 0;

            let score = dupInCatPenalty + (timesPlayed * 1000) + sameClubPenalty + Math.random();
            if (score < bestScore) {
              bestScore = score;
              bestIdx = i;
            }
          }

          let t2 = pool.splice(bestIdx, 1)[0];
          let chosenKey = buildMatchupKey(t1.name, t2.name, rama, cat);
          usedInCurrentCategory.add(chosenKey);
          rawPairs.push({ cat, rama, t1, t2, pairKey: chosenKey });
        }
      });

      let schedule = [];
      let occupiedSlots = new Set();
      let courts = state.courtNames.length > 0 ? state.courtNames : ["Cancha 1"];
      let timeslots = RESTRICTED_TIMESLOTS;

      function findAvailableSlot(preferredTimes) {
        for (let time of preferredTimes) {
          if (!timeslots.includes(time)) continue;
          for (let court of courts) {
            let key = `${time}|${court}`;
            if (!occupiedSlots.has(key)) {
              occupiedSlots.add(key);
              return { time, court };
            }
          }
        }
        for (let time of timeslots) {
          for (let court of courts) {
            let key = `${time}|${court}`;
            if (!occupiedSlots.has(key)) {
              occupiedSlots.add(key);
              return { time, court };
            }
          }
        }
        return { time: "16:00", court: courts[0] || "Cancha 1" };
      }

      rawPairs.sort((a, b) => {
        let aExact = (a.t1.restriction === 'EXACT' || a.t2.restriction === 'EXACT') ? 0 : 1;
        let bExact = (b.t1.restriction === 'EXACT' || b.t2.restriction === 'EXACT') ? 0 : 1;
        return aExact - bExact;
      });

      rawPairs.forEach(pair => {
        let { cat, rama, t1, t2 } = pair;
        let preferredTimes = [...timeslots];

        if (t1.restriction === 'EXACT') {
          let exactH = normalizeTimeToAllowedWindow(t1.specificTime);
          preferredTimes = [exactH, ...timeslots];
        } else if (t2.restriction === 'EXACT') {
          let exactH = normalizeTimeToAllowedWindow(t2.specificTime);
          preferredTimes = [exactH, ...timeslots];
        } else if (t1.restriction === 'EARLY' || t2.restriction === 'EARLY') {
          preferredTimes = [...timeslots];
        } else if (t1.restriction === 'LATE' || t2.restriction === 'LATE') {
          preferredTimes = [...timeslots].reverse();
        }

        let slot = findAvailableSlot(preferredTimes);

        schedule.push({
          id: 'm_' + Math.random().toString(36).substr(2, 9),
          rama: rama,
          category: cat,
          day: "Sábado",
          time: slot.time,
          court: slot.court,
          homeTeam: t1.name,
          homeClub: t1.club,
          awayTeam: t2.name,
          awayClub: t2.club
        });
      });

      schedule.sort((a, b) => {
        let cmpTime = a.time.localeCompare(b.time);
        if (cmpTime !== 0) return cmpTime;
        return a.court.localeCompare(b.court);
      });

      state.currentSchedule = schedule;
      saveLocalStorage();
      switchTab('schedule');
      showToast(`${schedule.length}`);
    }

    function renderScheduleAlerts(matches) {
      let alertsBox = document.getElementById('schedule-alerts-box');
      let conflicts = [];
      let slotCourtMap = {};
      let seenInRole = new Set();

      matches.forEach(m => {
        let key = `${m.time}-${m.court}`;
        if (slotCourtMap[key]) conflicts.push(`${m.court} • ${m.time}`);
        slotCourtMap[key] = true;

        let pairKey = buildMatchupKey(m.homeTeam, m.awayTeam, m.rama, m.category);
        if (seenInRole.has(pairKey)) conflicts.push(`${m.homeTeam} vs ${m.awayTeam}`);
        seenInRole.add(pairKey);

        let h = parseInt((m.time || "08:00").split(":")[0], 10);
        if (h < 8 || h > 16) conflicts.push(`${m.time}`);
      });

      if (conflicts.length > 0) {
        alertsBox.innerHTML = `
          <div class="bg-amber-50 border border-amber-300 rounded-2xl p-4 text-amber-900 text-xs flex items-start gap-3">
            <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-600 shrink-0 mt-0.5"></i>
            <ul class="list-disc list-inside space-y-0.5">
              ${conflicts.map(c => `<li>${c}</li>`).join('')}
            </ul>
          </div>
        `;
      } else {
        alertsBox.innerHTML = '';
      }
    }

    async function sendScheduleToGoogleSheets(jornadaTitle, matches) {
      if (!SHEETS_SAVE_WEBHOOK_URL || SHEETS_SAVE_WEBHOOK_URL.includes("PEGA_AQUI")) {
        return { sent: false };
      }
      try {
        await fetch(SHEETS_SAVE_WEBHOOK_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            sheetName: SHEETS_TARGET_TAB,
            jornada: jornadaTitle,
            matches: matches
          })
        });
        return { sent: true };
      } catch (err) {
        return { sent: false };
      }
    }

    }

    function saveLocalStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        leagueTitle: state.leagueTitle,
        courtsCount: state.courtsCount,
        courtNames: state.courtNames,
        rules: state.rules,
        weekendLabel: state.weekendLabel,
        forcedMatches: state.forcedMatches,
        currentSchedule: state.currentSchedule,
        activeJornadaId: state.activeJornadaId
      }));
    }

    function loadLocalStorage() {
      let saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          let parsed = JSON.parse(saved);
          state.leagueTitle = parsed.leagueTitle || state.leagueTitle;
          state.courtsCount = parsed.courtsCount || state.courtsCount;
          state.courtNames = parsed.courtNames || state.courtNames;
          state.rules = { ...state.rules, ...(parsed.rules || {}) };
          state.weekendLabel = parsed.weekendLabel || state.weekendLabel;
          state.forcedMatches = parsed.forcedMatches || [];
          state.currentSchedule = parsed.currentSchedule || [];
          state.activeJornadaId = parsed.activeJornadaId || null;
          state.days = ["Sábado"];
        } catch (e) {}
      }
    }

    function exportSeasonBackup() {
      let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
        leagueTitle: state.leagueTitle,
        courtsCount: state.courtsCount,
        courtNames: state.courtNames,
        rules: state.rules,
        weekendLabel: state.weekendLabel,
        forcedMatches: state.forcedMatches,
        currentSchedule: state.currentSchedule
      }, null, 2));
      let a = document.createElement('a');
      a.href = dataStr;
      a.download = `LIDEBA_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      showToast('OK');
    }

    function importSeasonBackup(e) {
      let file = e.target.files[0];
      if (!file) return;
      let reader = new FileReader();
      reader.onload = function(evt) {
        try {
          let parsed = JSON.parse(evt.target.result);
          state = { ...state, ...parsed, activeTeams: state.activeTeams };
          state.days = ["Sábado"];
          saveLocalStorage();
          renderAll();
          showToast('OK');
        } catch (err) {
          showToast('!', 'error');
        }
      };
      reader.readAsText(file);
    }

    window.onload = initApp;
  </script>
</body>
</html>
